# 生产形态的配置示例：两个 provider、同名模型做故障降级、按 key 限流
#
# 生成 keyHash：
#   java -jar feat-ai-gateway.jar hash sk-your-key
#
version: 2

server:
  port: 8080
  idleTimeoutMs: 300000

admin:
  # 强烈建议设置：不设置时管理接口只允许本机访问
  token: ${FEAT_GW_ADMIN_TOKEN}

log:
  dir: /var/log/feat-ai-gateway
  usageEnabled: true

providers:
  - name: openai
    baseUrl: https://api.openai.com
    apiKey: ${OPENAI_API_KEY}
    maxConnections: 1000
    connectTimeoutMs: 3000
    idleTimeoutMs: 300000

  - name: qwen
    baseUrl: https://dashscope.aliyuncs.com/compatible-mode
    apiKey: ${QWEN_API_KEY}
    maxConnections: 1000
    connectTimeoutMs: 3000
    # 部分国内网关要求不同的鉴权头，可以按 provider 覆盖
    authHeader: Authorization
    authPrefix: "Bearer "

models:
  # 主路由
  - name: gpt-4o
    provider: openai
    upstream: gpt-4o
    priority: 0

  # 同一个模型名的第二条路由 = 故障降级目标，只有主路由返回 429/5xx 或连接失败时才会用到
  - name: gpt-4o
    provider: qwen
    upstream: qwen-max
    priority: 100

  - name: text-embedding-3-small
    provider: openai
    upstream: text-embedding-3-small

keys:
  # 给某个部门/团队单独发一把 key，便于成本分摊
  - id: team-a
    keyHash: sha256:0000000000000000
    models: [gpt-4o]
    rpm: 600
    tpm: 100000
    monthlyTokens: 50000000

  # models 留空 = 允许调用任何已配置的模型
  - id: internal-tools
    keyHash: sha256:1111111111111111
    models: []
    rpm: 120
    tpm: 20000
    monthlyTokens: 5000000
