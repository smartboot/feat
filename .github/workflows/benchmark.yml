name: 框架性能基准测试

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 基础环境
      # ============================================================

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: 设置 Maven
        uses: stCarolas/setup-maven@v5

      - name: 安装 wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk unzip

      # ============================================================
      # 构建 Feat 主项目
      # ============================================================

      - name: 构建 Feat 主项目
        run: |
          FEAT_LICENSE="${{ secrets.FEAT_LICENSE }}" \
          mvn -B install \
            --file pom.xml \
            -DskipTests \
            -Dmaven.compiler.source=8 \
            -Dmaven.compiler.target=8

      # ============================================================
      # 初始化构建耗时文件
      # ============================================================

      - name: 初始化构建耗时记录
        run: |
          mkdir -p "$GITHUB_WORKSPACE/demo/benchmark/target/wrk-results"

          printf '%s\n' \
            "# Framework build benchmark" \
            "# Unit: milliseconds" \
            "# Quarkus uses a pre-built package and therefore has no compile time." \
            > "$GITHUB_WORKSPACE/demo/benchmark/target/wrk-results/build-times.txt"

      # ============================================================
      # 构建 Feat Benchmark
      # ============================================================

      - name: 构建 Feat Benchmark 并记录耗时
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/demo/benchmark/feat"
          mvn -B clean install -DskipTests
          start_time=$(date +%s%3N)

          export FEAT_LICENSE="${{ secrets.FEAT_LICENSE }}"

          mvn -B clean install -DskipTests

          end_time=$(date +%s%3N)
          elapsed=$((end_time - start_time))

          echo "feat=$elapsed" \
            >> "$GITHUB_WORKSPACE/demo/benchmark/target/wrk-results/build-times.txt"

          echo "Feat build time: ${elapsed} ms"

      # ============================================================
      # 构建 Vert.x Benchmark
      # ============================================================

      - name: 构建 Vert.x Benchmark 并记录耗时
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/demo/benchmark/vertx"
          mvn -B clean install -DskipTests
          start_time=$(date +%s%3N)

          mvn -B clean install -DskipTests

          end_time=$(date +%s%3N)
          elapsed=$((end_time - start_time))

          echo "vertx=$elapsed" \
            >> "$GITHUB_WORKSPACE/demo/benchmark/target/wrk-results/build-times.txt"

          echo "Vert.x build time: ${elapsed} ms"

      # ============================================================
      # 构建 Spring Boot Benchmark
      # ============================================================

      - name: 构建 Spring Boot Benchmark 并记录耗时
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/demo/benchmark/springboot"
          mvn -B clean install -DskipTests
          start_time=$(date +%s%3N)

          mvn -B clean install -DskipTests

          end_time=$(date +%s%3N)
          elapsed=$((end_time - start_time))

          echo "springboot=$elapsed" \
            >> "$GITHUB_WORKSPACE/demo/benchmark/target/wrk-results/build-times.txt"

          echo "Spring Boot build time: ${elapsed} ms"

      # ============================================================
      # 准备 Quarkus
      # ============================================================

      - name: 解压 Quarkus
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/demo/benchmark/target/quarkus"

          start_time=$(date +%s%3N)

          unzip -q \
            "$GITHUB_WORKSPACE/demo/benchmark/quarkus-app.zip" \
            -d "$GITHUB_WORKSPACE/demo/benchmark/target/quarkus"

          end_time=$(date +%s%3N)
          elapsed=$((end_time - start_time))

          echo "quarkus_prepare=$elapsed" \
            >> "$GITHUB_WORKSPACE/demo/benchmark/target/wrk-results/build-times.txt"

          echo "Quarkus package preparation time: ${elapsed} ms"
          echo "Quarkus is using a pre-built package; this is NOT compile time."

      # ============================================================
      # 输出构建耗时
      # ============================================================

      - name: 输出构建耗时
        run: |
          echo "========================================"
          echo "框架构建耗时"
          echo "========================================"

          cat "$GITHUB_WORKSPACE/demo/benchmark/target/wrk-results/build-times.txt"

          echo "========================================"

      # ============================================================
      # 启动服务
      # ============================================================

      - name: 启动框架服务
        shell: bash
        run: |
          export FEAT_LICENSE="${{ secrets.FEAT_LICENSE }}"

          mkdir -p "$GITHUB_WORKSPACE/demo/benchmark/target/wrk-results"

          # ----------------------------------------------------------
          # Feat
          # ----------------------------------------------------------

          cd "$GITHUB_WORKSPACE/demo/benchmark/feat"

          nohup mvn -B exec:java \
            > target/feat.log 2>&1 &

          echo $! > target/feat.pid

          echo "Feat 服务已启动，等待 5 秒..."
          sleep 5

          curl --fail --silent \
            http://localhost:8082/hello \
            > /dev/null

          # ----------------------------------------------------------
          # Vert.x
          # ----------------------------------------------------------

          cd "$GITHUB_WORKSPACE/demo/benchmark/vertx"

          nohup mvn -B exec:java \
            > target/vertx.log 2>&1 &

          echo $! > target/vertx.pid

          echo "Vert.x 服务已启动，等待 5 秒..."
          sleep 5

          curl --fail --silent \
            http://localhost:8081/hello \
            > /dev/null

          # ----------------------------------------------------------
          # Spring Boot
          # ----------------------------------------------------------

          cd "$GITHUB_WORKSPACE/demo/benchmark/springboot"

          nohup mvn -B exec:java \
            > target/springboot.log 2>&1 &

          echo $! > target/springboot.pid

          echo "Spring Boot 服务已启动，等待 5 秒..."
          sleep 5

          curl --fail --silent \
            http://localhost:8080/hello \
            > /dev/null

          # ----------------------------------------------------------
          # Quarkus
          # ----------------------------------------------------------

          cd "$GITHUB_WORKSPACE/demo/benchmark/target/quarkus"

          nohup java \
            -Dquarkus.http.port=8083 \
            -jar quarkus-run.jar \
            > "$GITHUB_WORKSPACE/demo/benchmark/target/quarkus.log" 2>&1 &

          echo $! > "$GITHUB_WORKSPACE/demo/benchmark/target/quarkus.pid"

          echo "Quarkus 服务已启动，等待 5 秒..."
          sleep 5

          curl --fail --silent \
            http://localhost:8083/hello \
            > /dev/null

      # ============================================================
      # Feat Benchmark
      # ============================================================

      - name: 测试 Feat Hello World 接口
        run: |
          cd "$GITHUB_WORKSPACE/demo/benchmark"

          wrk -t4 -c100 -d60s --latency \
            http://localhost:8082/hello \
            > target/wrk-results/feat-hello.txt

          echo "Feat Hello World 测试完成"

      - name: 测试 Feat JSON 接口
        run: |
          cd "$GITHUB_WORKSPACE/demo/benchmark"

          wrk -t4 -c100 -d60s --latency \
            http://localhost:8082/json \
            > target/wrk-results/feat-json.txt

          echo "Feat JSON 测试完成"

      # ============================================================
      # Quarkus Benchmark
      # ============================================================

      - name: 测试 Quarkus Hello World 接口
        run: |
          cd "$GITHUB_WORKSPACE/demo/benchmark"

          wrk -t4 -c100 -d60s --latency \
            http://localhost:8083/hello \
            > target/wrk-results/quarkus-hello.txt

          echo "Quarkus Hello World 测试完成"

      - name: 测试 Quarkus JSON 接口
        run: |
          cd "$GITHUB_WORKSPACE/demo/benchmark"

          wrk -t4 -c100 -d60s --latency \
            http://localhost:8083/json \
            > target/wrk-results/quarkus-json.txt

          echo "Quarkus JSON 测试完成"

      # ============================================================
      # Vert.x Benchmark
      # ============================================================

      - name: 测试 Vert.x Hello World 接口
        run: |
          cd "$GITHUB_WORKSPACE/demo/benchmark"

          wrk -t4 -c100 -d60s --latency \
            http://localhost:8081/hello \
            > target/wrk-results/vertx-hello.txt

          echo "Vert.x Hello World 测试完成"

      - name: 测试 Vert.x JSON 接口
        run: |
          cd "$GITHUB_WORKSPACE/demo/benchmark"

          wrk -t4 -c100 -d60s --latency \
            http://localhost:8081/json \
            > target/wrk-results/vertx-json.txt

          echo "Vert.x JSON 测试完成"

      # ============================================================
      # Spring Boot Benchmark
      # ============================================================

      - name: 测试 Spring Boot Hello World 接口
        run: |
          cd "$GITHUB_WORKSPACE/demo/benchmark"

          wrk -t4 -c100 -d60s --latency \
            http://localhost:8080/hello \
            > target/wrk-results/springboot-hello.txt

          echo "Spring Boot Hello World 测试完成"

      - name: 测试 Spring Boot JSON 接口
        run: |
          cd "$GITHUB_WORKSPACE/demo/benchmark"

          wrk -t4 -c100 -d60s --latency \
            http://localhost:8080/json \
            > target/wrk-results/springboot-json.txt

          echo "Spring Boot JSON 测试完成"

      # ============================================================
      # Python
      # ============================================================

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib pandas

      # ============================================================
      # 生成报告
      # ============================================================

      - name: 生成性能报告
        run: |
          cd "$GITHUB_WORKSPACE/demo/benchmark"

          python generate_benchmark_report.py

          echo "性能报告生成完成"

      # ============================================================
      # 上传报告
      # ============================================================

      - name: 上传性能报告
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: demo/benchmark/target/benchmark-report/
          retention-days: 30

      # ============================================================
      # 输出日志
      # ============================================================

      - name: 输出服务日志
        if: always()
        run: |
          for log in \
            "$GITHUB_WORKSPACE/demo/benchmark/feat/target/feat.log" \
            "$GITHUB_WORKSPACE/demo/benchmark/vertx/target/vertx.log" \
            "$GITHUB_WORKSPACE/demo/benchmark/springboot/target/springboot.log" \
            "$GITHUB_WORKSPACE/demo/benchmark/target/quarkus.log"
          do
            if [ -f "$log" ]; then
              echo "===== $log ====="
              tail -n 40 "$log"
            fi
          done