# feat-plus 的端到端回归。
#
# 为什么不是 mvn test：feat-plus 没有单元测试，232 项断言全部是打真实 HTTP 接口的脚本
# （scripts/regress_*.py）。它们验证的是「注解处理器生成的路由 + MyBatis 动态 SQL +
# 权限与数据范围」三者合起来的行为，用 JUnit 反而要重新搭一套容器。
#
# 流程固定为：装框架 → 建前端 → 编译 → 起服务 → 打接口。少一步都可能出现
# 「本地绿、CI 红」或反之。
name: feat-plus 回归

on:
  push:
    branches: [ "master" ]
    paths:
      - 'demo/feat-plus/**'
      - 'feat-core/**'
      - 'feat-cloud/**'
      - '.github/workflows/feat-plus.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'demo/feat-plus/**'
      - 'feat-core/**'
      - 'feat-cloud/**'
      - '.github/workflows/feat-plus.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 目录结构只有配了检查才算架构，否则只是标签。
      # 放在最前面：不依赖 JDK 与编译产物，违反分层或事务约束时几秒内就失败，
      # 不用等前端构建和三个模块编译跑完。
      - name: 检查分层与事务约束
        run: |
          python3 demo/feat-plus/scripts/check_layers.py
          python3 demo/feat-plus/scripts/check_tx.py

      - name: 安装 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: demo/feat-plus/web/package-lock.json

      # feat-plus 依赖 feat-cloud 的 SNAPSHOT，必须先装进本地仓库，
      # 否则会去中央仓库找 2.4.3-SNAPSHOT 而失败。
      - name: 构建并安装 Feat 框架
        run: mvn -B install -DskipTests -Dmaven.compiler.source=8 -Dmaven.compiler.target=8

      - name: 构建前端
        working-directory: demo/feat-plus/web
        run: |
          npm ci
          npm run build

      # 前端产物要落到 resources 下，服务才会把它当静态资源提供。
      - name: 同步静态资源
        run: |
          rm -rf demo/feat-plus/src/main/resources/static
          mkdir -p demo/feat-plus/src/main/resources/static
          cp -r demo/feat-plus/web/dist/. demo/feat-plus/src/main/resources/static/

      - name: 编译后端（注解处理器生成路由）
        run: mvn -B -f demo/feat-plus/pom.xml compile

      # cp.txt 在 .gitignore 里，干净环境必须自己生成。
      - name: 生成运行时 classpath
        run: mvn -B -f demo/feat-plus/pom.xml dependency:build-classpath -Dmdep.outputFile=cp.txt

      - name: 启动服务
        working-directory: demo/feat-plus
        run: |
          java -cp "target/classes:$(cat cp.txt)" tech.smartboot.feat.demo.plus.Bootstrap > /tmp/feat-plus.log 2>&1 &
          # 未登录访问 /api/auth/me 会返回 401。能拿到 401 就说明端口已通，
          # 不用 200 作判据，否则要先去登录。
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/auth/me || true)
            if [ "$code" = "401" ]; then
              echo "服务已就绪（第 ${i} 次探测）"
              exit 0
            fi
            sleep 1
          done
          echo "服务在 60 秒内没有就绪"
          tail -50 /tmp/feat-plus.log
          exit 1

      # 顺序固定：每份脚本都会自己 reset-demo，但 crud → scope → audit → profile
      # 与 README 里记的顺序一致，排查失败时省一次猜。
      - name: 运行回归断言
        working-directory: demo/feat-plus
        run: |
          set -e
          python3 scripts/regress_crud.py
          python3 scripts/regress_scope.py
          python3 scripts/regress_audit.py
          python3 scripts/regress_profile.py
          python3 scripts/regress_cache.py
          python3 scripts/regress_tx.py

      - name: 失败时输出服务日志
        if: failure()
        run: tail -100 /tmp/feat-plus.log || true
